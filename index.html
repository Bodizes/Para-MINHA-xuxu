<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
</body>
<body>

    <header>
        <h1>Para Você ❤️</h1>
        <p>Um cantinho feito especialmente para você.</p>
    </header>

    <main>

        <section class="menu">

            <button onclick="abrirAba('amor')">
                ❤️ Eu te amo
            </button>

            <button onclick="abrirAba('poemas')">
                🌹 Poemas
            </button>

            <button class="card-button" onclick="abrirAba('piadas')">

    <div class="icon">🕷️</div>

    <div class="button-text">
        <strong>A piada da aranha</strong>
        <small>Essa é especialmente ruim KSKSKSK</small>
    </div>

    <div class="arrow">→</div>

            </button>

         <button class="card-button" onclick="abrirAba('vinte-motivos')">

    <div class="icon">20</div>

    <div class="button-text">
        <strong>20 motivos</strong>
        <small>Descubra um por um...</small>
    </div>

    <div class="arrow">→</div>

         </button>

            <button onclick="abrirAba('surpresa')">
                🎁 Surpresa
            </button>

        </section>

        <section id="conteudo" class="conteudo">

            <h2>Bem-vinda 💗</h2>

            <p>
                Clique em uma das opções acima
                para descobrir uma pequena surpresa.
            </p>

        </section>

    </main>

    <footer>
        Feito com AMOR especialmente para você.
    </footer>


    <script>

        function abrirAba(aba) {

            const conteudo = document.getElementById("conteudo");

            if (aba === "amor") {

                conteudo.innerHTML = `
                    <h2>Eu te amo 🫶</h2>

                    <p>
                        Eu te amo de um jeito que às vezes nem sei explicar.
                        Você conseguiu transformar pequenos momentos
                        em lembranças que eu quero guardar para sempre.
                    </p>
                `;

            }

            else if (aba === "poemas") {

                conteudo.innerHTML = `
                    <h2>Um pequeno poema 🌹</h2>

                    <p>
                        Se eu pudesse guardar um momento,<br>
                        guardaria todos ao seu lado.<br>
                        Porque entre tantos caminhos,<br>
                        você se tornou meu lugar favorito.
                    </p>
                `;

            }

            else if (aba === "piadas") {

    conteudo.innerHTML = `
        <div class="message-icon">🕷️</div>

        <h2>A piada da aranha</h2>

        <p>
            Você sabe qual é o animal mais carente do mundo?
            <br><br>

            <strong>A aranha.</strong> 🕷️
            <br><br>

            Porque ela é...
            <br><br>

            <strong class="big-love">
                ARAC-NEED-YOU
            </strong>
            <br><br>

            KAKAKAKKAKAKAKKAKAKAKAK
            <br><br>


            Essa foi de tiozão.
            Mas eu precisava colocar aqui. 
            (porque eu sou que nem a aranha) 😭
        </p>
    `;

            }

else if (aba === "vinte-motivos") {

    const motivos = [

        "Seu jeito de ser. ♡",

        "Sua espontaneiadade, que consegue deixar qualquer momento mais especial.",

        "O jeito que você conversa comigo.",

        "Nossas brincadeiras completamente sem sentido KSKSKSK.",

        "Seus áudios.",

        "Os momentos aleatórios que acabam virando memórias.",

        "A forma como você consegue melhorar meus dias.",

        "Nossas conversas que parecem nunca acabar.",

        "As lembranças que estamos criando juntos.",

        "Seu carinho.",
        
        "Sua personalidade e tudo que faz você ser você.",

        "O jeito único que você age.",

        "As coisas pequenas que você faz ou fala e talvez nem perceba.",

        "Nossas pequenas Conversas satisfatórias.",

        "Aqueles momentos simples que acabam sendo os melhores.",

        "As suas doideiras.",

        "Todas as histórias que ainda podemos criar.",

        "O fato de que, entre tantas pessoas, VOCÊ se tornou alguém tão especial para mim.",

        "Você é tão perfeitinha.",

        "E o principal: porque simplesmente é você. ❤️"

    ];

    let motivoAtual = 0;

    conteudo.innerHTML = `
        <div class="message-icon">20</div>

        <p class="motivo-numero">
            MOTIVO <span>01</span> / 20
        </p>

        <h2>Por que você? ♡</h2>

        <p id="texto-motivo" class="motivo-texto">
            ${motivos[0]}
        </p>

        <button class="next-button" onclick="proximoMotivo()">
            Próximo motivo →
        </button>
    `;

    window.proximoMotivo = function() {

        motivoAtual++;

        const texto = document.getElementById("texto-motivo");
        const numero = document.querySelector(".motivo-numero span");
        const botao = document.querySelector(".next-button");

        if (motivoAtual < motivos.length) {

            texto.style.opacity = "0";
            texto.style.transform = "translateY(8px)";

            setTimeout(() => {

                texto.textContent = motivos[motivoAtual];

                numero.textContent =
                    String(motivoAtual + 1).padStart(2, "0");

                texto.style.opacity = "1";
                texto.style.transform = "translateY(0)";

            }, 180);

        }

        else {

            texto.style.opacity = "0";

            setTimeout(() => {

                numero.textContent = "♡";

                texto.innerHTML = `
                    <strong class="big-love">
                        E esses são só 20.
                        <br><br>
                        Eu poderia continuar...
                        <br><br>
                        mas acho que você já entendeu. ❤️
                    </strong>
                `;

                texto.style.opacity = "1";

                botao.textContent = "Voltar ao primeiro motivo ↻";

                botao.onclick = function() {

                    motivoAtual = 0;

                    numero.textContent = "01";

                    texto.innerHTML = motivos[0];

                    botao.textContent = "Próximo motivo →";

                    botao.onclick = window.proximoMotivo;
                };

            }, 180);

        }

    };

}

            else if (aba === "surpresa") {

                conteudo.innerHTML = `
                    <h2>🎁 Surpresa!</h2>

                    <p>
                        Se você chegou até aqui,
                        significa que abriu todas as abas
                        E EU TE AMOOOOOO POR ESSE TEMPINHO DE ATENÇÃO
                        <br><br>

                        <strong>
                            Eu escolheria você em todas vidas. 🫶
                        </strong>
                    </p>
                `;

            }

        }

    </script>

</body>
</html>
<!-- MÚSICA -->
<audio id="musica" loop>
    <source src="No%20escuro.mp3" type="audio/mpeg">
</audio>

<div class="music-player">
    <button id="botaoMusica" onclick="toggleMusica()">🎵</button>

    <div class="music-info">
        <span class="music-title">No escuro — ANAVITÓRIA</span>
        <span class="music-message">
            Estou aprendendo essa música para cantar pra você. ♡
        </span>
    </div>
</div>
