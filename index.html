<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Para Você ❤️</h1>
        <p>Um cantinho feito especialmente para você.</p>
    </header>

    <main>

        <section class="menu">

            <button onclick="abrirAba('amor')">
                ❤️ Eu te amo
            </button>

            <button onclick="abrirAba('poemas')">
                🌹 Poemas
            </button>

            <button onclick="abrirAba('piadas')">
                😂 Piadas
            </button>

            <button onclick="abrirAba('motivos')">
                💗 Motivos
            </button>

            <button onclick="abrirAba('surpresa')">
                🎁 Surpresa
            </button>

        </section>

        <section id="conteudo" class="conteudo">

            <h2>Bem-vinda ❤️</h2>

            <p>
                Clique em uma das opções acima
                para descobrir uma pequena surpresa.
            </p>

        </section>

    </main>

    <footer>
        Feito com ❤️ especialmente para você.
    </footer>


    <script>

        function abrirAba(aba) {

            const conteudo = document.getElementById("conteudo");

            if (aba === "amor") {

                conteudo.innerHTML = `
                    <h2>Eu te amo ❤️</h2>

                    <p>
                        Eu te amo de um jeito que às vezes nem sei explicar.
                        Você conseguiu transformar pequenos momentos
                        em lembranças que eu quero guardar para sempre.
                    </p>
                `;

            }

            else if (aba === "poemas") {

                conteudo.innerHTML = `
                    <h2>Um pequeno poema 🌹</h2>

                    <p>
                        Se eu pudesse guardar um momento,<br>
                        guardaria todos ao seu lado.<br>
                        Porque entre tantos caminhos,<br>
                        você se tornou meu lugar favorito.
                    </p>
                `;

            }

            else if (aba === "piadas") {

                conteudo.innerHTML = `
                    <h2>Hora da piada 😂</h2>

                    <p>
                        Você sabe por que eu nunca consigo ficar bravo com você?
                        <br><br>
                        Porque você olha pra mim e eu esqueço até o motivo. ❤️
                    </p>
                `;

            }

            else if (aba === "motivos") {

                conteudo.innerHTML = `
                    <h2>Alguns motivos 💗</h2>

                    <p>
                        Seu jeito.<br>
                        Seu sorriso.<br>
                        Nossas conversas.<br>
                        Nossas brincadeiras.<br>
                        Os momentos simples.<br><br>

                        E principalmente... você. ❤️
                    </p>
                `;

            }

            else if (aba === "surpresa") {

                conteudo.innerHTML = `
                    <h2>🎁 Surpresa!</h2>

                    <p>
                        Se você chegou até aqui,
                        significa que abriu todas as abas.
                        <br><br>

                        <strong>
                            Eu escolheria você novamente. ❤️
                        </strong>
                    </p>
                `;

            }

        }

    </script>

</body>
</html>
